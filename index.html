<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Larder</title>
<meta name="theme-color" content="#F3F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Larder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Larder, direction A "Soft Light": iOS-like cards on a warm grey ground, Inter, tomato accent, floating glass tab bar */
:root{color-scheme:light dark;
 --bg:light-dark(#F3F3F0,#000000);--card:light-dark(#FFFFFF,#1C1C1E);--sunk:light-dark(#EFEFEC,#2C2C2E);--line:light-dark(#EEEEEA,#2C2C2E);
 --ink:light-dark(#17181A,#F5F5F7);--mute:light-dark(#62656A,#A1A1A8);--faint:light-dark(#8A8D92,#7C7C84);
 --acc:#E8553D;--acc-ink:light-dark(#B8371F,#FF8A70);--acc-soft:light-dark(#FDECE8,#3A1E18);
 --pro:light-dark(#4C6FFF,#7C95FF);--carb:light-dark(#E79A23,#F5C26B);--fat:light-dark(#9B6BDF,#C49BFF);--fib:light-dark(#2E8B57,#6CCB92);
 --pos:light-dark(#2B7D50,#6CCB92);--warm:light-dark(#FFF1E6,#33251A);--leafbg:light-dark(#EAF5EE,#17291F);--bluebg:light-dark(#EEF1FF,#1C2140);--lilac:light-dark(#F4EEFC,#2A2140);
 --shadow:light-dark(0 1px 2px rgba(0,0,0,.04),0 0 0 transparent);--glass:light-dark(rgba(255,255,255,.86),rgba(36,36,38,.82))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(110px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:0 16px}
.top{display:none}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 4px 0;margin-bottom:16px}
.hd h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.eyebrow{display:block;font-size:13px;font-weight:600;color:var(--mute)}
.hd-act{display:flex;align-items:center;gap:6px}
.fab{width:44px;height:44px;min-height:44px;padding:0;border-radius:22px;border:0;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;flex:none}
.fab.acc{background:var(--acc);color:#fff}
.ic{width:36px;height:36px;min-height:36px;padding:0;border:0;border-radius:18px;background:var(--card);color:var(--ink);font-size:20px;display:inline-flex;align-items:center;justify-content:center}
.ic:disabled{opacity:.35}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin:26px 4px 10px;line-height:1.2}
h3{font-size:16px;font-weight:700;margin:0}
h4{font-size:13px;font-weight:700;margin:12px 0 4px;color:var(--mute)}
p{margin:6px 0}
.meta,.none{font-size:13px;color:var(--mute)}
.none{margin:4px 0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.card,.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.secthd{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px}
.secthd h2{margin:0}
.link{background:none;border:0;padding:0;min-height:32px;font:inherit;font-size:14px;font-weight:600;color:var(--acc-ink);cursor:pointer}
button,.btn{font:inherit;font-weight:700;font-size:15px;min-height:46px;padding:0 18px;border-radius:16px;border:0;background:var(--sunk);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;text-decoration:none;white-space:nowrap}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--ink);color:var(--bg)}
.acc{background:var(--acc);color:#fff}
.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px}
.ghost{background:none}
.soft{background:var(--acc-soft);color:var(--acc-ink)}
.wide{width:100%;margin-top:14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;min-height:46px;padding:10px 12px;border:0;border-radius:14px;background:var(--sunk);color:var(--ink);width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{color:var(--faint)}
.f{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.f>span{display:block;margin:0 0 5px 2px}
.chk{display:flex;gap:12px;align-items:center;min-height:46px;font-size:15px}
.chk input{width:22px;height:22px;min-height:0;padding:0;flex:none;-webkit-appearance:auto;appearance:auto;accent-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.span2{grid-column:1/-1}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1 1 160px;width:auto}
/* today: ring card */
.ringcard{display:flex;align-items:center;gap:18px;padding:20px;border-radius:28px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{display:block}
.ring .trk{stroke:var(--sunk)}
.ring .prg{stroke:var(--acc);transition:stroke-dashoffset .6s ease}
.ring .prg.ov{stroke:var(--acc-ink)}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringc b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.ringc span{font-size:12px;font-weight:600;color:var(--mute)}
.ringc.over b{color:var(--acc-ink)}
.stats{display:flex;flex-direction:column;gap:12px;flex:1}
.stat{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.stat span{font-size:12px;color:var(--mute);font-weight:600}
.stat b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{font-size:11px;color:var(--mute);font-weight:500}
button.stat{min-height:0;padding:0;background:none;border-radius:8px;font-weight:inherit}
.pos{color:var(--pos)}
.addlink{font-size:15px;font-weight:700;color:var(--acc-ink)}
.macs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mac{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.mac span{font-size:12px;font-weight:600;color:var(--mute)}
.mac b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.mac b small{font-size:12px;color:var(--mute);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--ink))}
.bar i.ov{background:var(--acc)}
.fibre{margin-top:10px;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px}
.fibre .bar{flex:1}
.fibre span{font-size:13px;font-weight:600;white-space:nowrap}
/* meals list */
.meals{padding:4px 16px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meals>div:last-child .mrow,.meals>div:last-child{border-bottom:0}
.mgrp{border-bottom:1px solid var(--line)}
.mgrp:last-child{border-bottom:0}
.mgrp .mrow{border-bottom:0}
.mi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.mi.Breakfast{background:var(--warm);color:#D9771E}.mi.Lunch{background:var(--leafbg);color:var(--fib)}.mi.Dinner{background:var(--bluebg);color:var(--pro)}.mi.Snacks{background:var(--lilac);color:var(--fat)}
.mt{flex:1;display:flex;flex-direction:column}
.mt b{font-size:15px;font-weight:700}
.mt span{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc{font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.plus{width:32px;height:32px;min-height:32px;padding:0;border-radius:16px;background:var(--sunk);font-size:18px;flex:none}
.entry{display:flex;gap:10px;align-items:center;padding:6px 0 6px 52px;font-size:14px}
.entry .n{flex:1;min-width:0}
.entry small{display:block;color:var(--mute);font-size:12px}
.entry:last-child{padding-bottom:12px}
.x{width:36px;min-height:36px;height:36px;padding:0;border:0;background:none;color:var(--faint);font-size:20px;flex:none}
.install{display:flex;gap:10px;align-items:center;margin:4px 0 14px;padding:12px 14px;border-radius:18px;background:var(--card);font-size:14px}
/* kitchen */
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:16px;background:var(--card);padding:0 14px;color:var(--faint)}
.search input{background:none;padding:0;min-height:0;height:100%;border-radius:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;min-height:36px;padding:0 14px;border-radius:18px;background:var(--card);font-size:14px;font-weight:600;flex:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:700}
.cnt{font-weight:500;opacity:.65}
.soon{margin-top:16px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:var(--acc-soft)}
.soon div{flex:1;display:flex;flex-direction:column;gap:2px}
.soon small{font-size:13px;font-weight:700;color:var(--acc-ink)}
.soon b{font-size:15px;font-weight:600}
.soon .btn{background:var(--card);color:var(--acc-ink);min-height:38px;border-radius:14px;font-size:13px}
.ilist{margin-top:12px;padding:2px 16px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.out{opacity:.55}
.itap{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;padding:2px 0;min-height:44px;border-radius:8px;text-align:left;white-space:normal;font-weight:inherit}
.itap b{font-size:15px;font-weight:700}
.itap span{font-size:13px;color:var(--mute);font-weight:400}
.tag{font-size:10px;font-weight:700;color:var(--mute);background:var(--sunk);border-radius:6px;padding:1px 5px;margin-right:4px}
.exp{font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;color:var(--mute);background:var(--sunk)}
.exp.soonx{color:var(--acc-ink);background:var(--acc-soft)}
.stepper{display:inline-flex;align-items:center;background:var(--sunk);border-radius:12px;flex:none}
.stepper button{width:34px;height:36px;min-height:36px;padding:0;background:none;font-size:18px;border-radius:12px}
.stepper span{min-width:22px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.empty{padding:28px 20px;text-align:center;border-radius:24px;background:var(--card);color:var(--mute);margin-top:14px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .btn{flex:1}
/* meals tab */
.idea{background:var(--card);border-radius:24px;padding:16px 18px;margin:12px 0;box-shadow:var(--shadow)}
.ih{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ih h3{font-size:17px}
.macros{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin:10px 0 0;color:var(--mute)}
.macros b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.idea ul,.idea ol{margin:4px 0;padding-left:20px;font-size:15px}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;font-size:15px}
.skel{height:150px;border-radius:24px;margin:12px 0;background:linear-gradient(90deg,var(--card) 20%,var(--sunk) 50%,var(--card) 80%);background-size:250% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
.status{font-size:14px;padding:12px 14px;background:var(--sunk);border-radius:14px;margin:12px 0 0}
.status.err{color:var(--acc-ink);background:var(--acc-soft)}
/* progress */
.wk{display:grid;grid-template-columns:3em minmax(0,1fr) 4.5em;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.wk .bar{height:12px;border-radius:6px}
.wk .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{position:relative;min-height:200px;margin:12px 0 4px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wl{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:15px}
.wl:last-child{border-bottom:0}
.presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:14px}
.seg{display:inline-flex;background:var(--sunk);border-radius:14px;padding:3px;gap:2px}
.seg button{min-height:38px;border-radius:11px;background:none;font-size:14px;padding:0 14px;flex:1}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.full{display:flex;margin-top:16px}
.burnrow{display:none}
.warn{border-radius:18px;padding:12px 16px;margin:12px 0;background:var(--acc-soft)}
.warn>b{color:var(--acc-ink)}
.warn ul{margin:6px 0 2px;padding-left:18px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;flex-wrap:wrap}
.kv b{font-variant-numeric:tabular-nums}
.recbig{font-weight:800;font-size:clamp(44px,13vw,56px);letter-spacing:-.03em;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.recbig span{font-size:16px;font-weight:600;letter-spacing:0;color:var(--mute)}
.ok{color:var(--pos);font-weight:700;margin-top:12px}
.hft{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.panel ol{padding-left:20px;font-size:15px}.panel ol li{margin:4px 0}
.ai-src{display:grid;gap:8px;margin-top:12px}
.reply{margin-top:8px}
/* tab bar */
.tabs{position:fixed;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;height:64px;border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 8px 30px rgba(0,0,0,.14);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;z-index:20}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint);text-decoration:none;height:100%;justify-content:center;border-radius:32px}
.tabs a[aria-current=page]{color:var(--ink);font-weight:700}
.tabs svg{width:22px;height:22px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.4);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:28px 28px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--faint);opacity:.4;margin:0 auto 4px}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.skel{animation:none}.ring .prg{transition:none}}
.shh{display:flex;align-items:center;justify-content:space-between}
.shh h2{margin:10px 4px}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{flex-direction:column;min-height:80px;font-size:13px;line-height:1.2;white-space:normal;text-align:center;padding:10px 8px;background:var(--card);border-radius:20px;font-weight:600}
.tool svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);border-radius:18px;padding:6px 6px 6px 16px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px);font-size:14px;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{background:var(--bg);color:var(--ink);min-height:36px;border-radius:12px}
.toast span{padding:8px 0}
/* scanner */
.scanner{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;color:#fff}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:relative;width:min(82vw,360px);aspect-ratio:1.7;border:3px solid #fff;border-radius:22px;box-shadow:0 0 0 100vmax rgb(0 0 0/.45)}
.reticle::after{content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;background:#E8553D;animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
@media (prefers-reduced-motion:reduce){.reticle::after{animation:none}}
.scanbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:center}
.scanbar p{margin:0;font-weight:700;text-shadow:0 1px 6px #000;text-align:center}
.scanner .btn{background:#fff;color:#111;border-radius:22px}
.scanner .btn.ghost{background:rgb(0 0 0/.35);color:#fff;box-shadow:inset 0 0 0 1.5px #fff}
@media (max-width:440px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:370px){.ring{width:128px;height:128px}.ring svg{width:128px;height:128px}.ringc b{font-size:28px}.ringcard{gap:12px;padding:16px}}
</style>


</head><body>
<header class="top"><div class="brand">Larder</div><div class="sync" id="sync"></div></header>
<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
 <a href="#today" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg>Today</a>
 <a href="#kitchen" data-t="kitchen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M5 9h14M9 5v2M9 12v3"/></svg>Kitchen</a>
 <a href="#meals" data-t="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>Meals</a>
 <a href="#progress" data-t="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M4 16l5-5 4 3 7-8"/></svg>Progress</a>
</nav>

<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
 <div class="shh"><h2 id="sh-t">Add food</h2><button class="x" data-a="close" aria-label="Close">×</button></div>
 <div class="tools">
  <button class="btn tool" data-a="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5v14M6 5v14M10 5v14M12 5v14M15 5v14M19 5v14M21 5v14"/></svg>Scan barcode</button>
  <label class="btn tool" id="labelbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20"/><path d="M5 7h14M8 11h8M8 14h8M8 17h5"/></svg>Photo of label<input type="file" accept="image/*" capture="environment" class="vh" id="in-label"></label>

<script src="zxing.min.js"></script>
<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const fmt=n=>Math.round(num(n)).toLocaleString();
const g1=n=>{const r=Math.round(num(n)*10)/10;return r%1?r.toFixed(1):String(r)};
const nid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseD=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addD=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return dkey(d)};
const TODAY=()=>dkey(new Date());
const MEALS=['Breakfast','Lunch','Dinner','Snacks'],LOCS=['Pantry','Fridge','Freezer'];
const mealNow=()=>{const n=new Date(),h=n.getHours()+n.getMinutes()/60;return h<10.5?'Breakfast':h<15?'Lunch':h<20.5?'Dinner':'Snacks'};
const daysTo=k=>k?Math.round((parseD(k)-parseD(TODAY()))/864e5):null;
const LB=2.20462;
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

const S={prof:{sex:'',age:'',h:'',act:'1.2',cur:'',goal:'',date:''},burn:{},plan:null,inv:[],foods:{},goals:{kcal:1800,p:130,c:180,f:60,fib:28,unit:'kg',credit:50},set:{gemKey:'',gemModel:'gemini-2.5-flash'},weights:[],logs:{},day:TODAY(),tab:'today',loc:'All',q:'',ideas:null,ideaErr:'',busy:false,mopt:{meal:mealNow(),n:'1',fit:true,exp:true,strict:false,note:''}};

/* ---------- storage: this phone ---------- */
const K='larder:';
const load=(k,def)=>{try{const v=localStorage.getItem(K+k);if(v)return JSON.parse(v)}catch(e){}return def};
const save=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){toast('Phone storage is full. Delete some old items or make a backup.')}};
const saveInv=()=>save('inv',{items:S.inv});
const saveDay=k=>save('log-'+k,{entries:S.logs[k]||[]});
const saveGoals=()=>save('goals',S.goals);
const saveW=()=>save('weights',{list:S.weights});
const saveSet=()=>save('settings',S.set);
const saveProf=()=>save('profile',S.prof);
const saveBurn=()=>save('burn',{map:S.burn});
const burnedFor=d=>num(S.burn[d]);
const credit=()=>{const c=S.goals.credit;return c===undefined||c===null||c===''?50:Math.max(0,Math.min(100,num(c)))};
const extraFor=d=>Math.round(burnedFor(d)*credit()/100);
function day(k){if(!S.logs[k]){const d=load('log-'+k,{entries:[]});S.logs[k]=Array.isArray(d.entries)?d.entries:[]}return S.logs[k]}

/* ---------- AI: Claude app hand-off, or Gemini free tier ---------- */
const hasGem=()=>!!S.set.gemKey;
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function gemini(prompt,img){
 if(!hasGem())throw{code:'nokey'};
 const parts=[{text:prompt+'\n\nRespond with only the JSON object.'}];
 if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:await b64(img)}});
 let r;
 try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.set.gemModel||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(S.set.gemKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:.7}})})}catch(e){throw{code:'offline'}}
 if(r.status===429)throw{code:'rate_limited'};
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw{code:'api',message:(j.error&&j.error.message)||('HTTP '+r.status)};
 const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
 return parseJSON(t);
}
function parseJSON(t){t=String(t||'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw{code:'parse'};return JSON.parse(t.slice(a,b+1))}
const errMsg=e=>e&&e.code==='nokey'?'Add a free Gemini key in Progress → Meal ideas helper to use this.':e&&e.code==='rate_limited'?'Gemini’s free limit is used up for now. Try again later, or use the Claude app.':e&&e.code==='offline'?'You’re offline. Try again when you have a connection.':e&&e.code==='api'?'Gemini said: '+e.message:'That didn’t work. Try again, or fill the numbers in by hand.';
function openClaude(prompt){
 let ok=true;
 try{navigator.clipboard.writeText(prompt).catch(()=>{ok=false})}catch(e){ok=false}
 const url='https://claude.ai/new?q='+encodeURIComponent(prompt.slice(0,12000));
 const w=window.open(url,'_blank');if(!w)location.href=url;
 toast(ok?'Prompt copied. If Claude opens with an empty box, paste it in.':'Claude is opening with your prompt');
}

/* ---------- images & barcodes ---------- */
function scaled(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(),'image/jpeg',.88)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function hints(hard){const Z=window.ZXing,h=new Map();if(hard)h.set(Z.DecodeHintType.TRY_HARDER,true);h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);return h}
async function decodePhoto(file){
 if(!window.ZXing)return null;
 for(const size of [1400,900,2000]){let img;try{img=await scaled(file,size);const r=await new ZXing.BrowserMultiFormatReader(hints(true)).decodeFromImageUrl(img.url);if(r)return r.getText()}catch(e){}finally{if(img)URL.revokeObjectURL(img.url)}}
 return null;
}
let reader=null,scanDone=false;
async function startScan(){
 if(!window.ZXing){st('The scanner didn’t load. Close and reopen the app.',true);return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st('This browser can’t use the camera. Open Larder from your Home Screen, or type the barcode number.',true);return}
 scanDone=false;$('#scanner').hidden=false;$('#scan-msg').textContent='Line up the barcode inside the box';
 reader=new ZXing.BrowserMultiFormatReader(hints(false),200);
 try{
  await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},$('#scan-v'),(res)=>{if(res&&!scanDone){scanDone=true;const code=res.getText();stopScan();gotCode(code)}});
 }catch(e){stopScan();st(e&&e.name==='NotAllowedError'?'Camera access is off. Turn it on in Settings › Safari › Camera (or for Larder), then try again. You can also type the barcode number.':'Couldn’t start the camera. Try “Use a photo”, or type the barcode number.',true)}
}
function stopScan(){try{reader&&reader.reset()}catch(e){}reader=null;const v=$('#scan-v');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}$('#scanner').hidden=true}
async function gotCode(code){
 code=String(code).replace(/\D/g,'');if(!code)return;
 $('#f-code').value=code;
 const k=S.foods[code];
 if(k){fill({...k,code});st(`Found ${k.name} in your saved products.`);return}
 await lookupOFF(code);
}
async function lookupOFF(code){
 st(`Looking up ${code}…`);
 try{
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,product_name_fr,brands,serving_size,nutriments`);
  let j=await r.json();
  if((j.status!==1||!j.product)&&code.length===12){const r2=await fetch(`https://world.openfoodfacts.org/api/v2/product/0${encodeURIComponent(code)}.json?fields=product_name,product_name_en,product_name_fr,brands,serving_size,nutriments`);j=await r2.json()}
  if(j.status!==1||!j.product){st(`${code} isn’t in the Open Food Facts database yet. ${hasGem()?'Tap “Photo of label” and I’ll read it, or enter':'Enter'} the numbers from the label; it’ll be remembered next time you scan it.`);return}
  const p=j.product,n=p.nutriments||{},per=n['energy-kcal_serving']!=null||n['proteins_serving']!=null;
  const v=k=>{const x=n[k+(per?'_serving':'_100g')];return x==null?undefined:num(x)};
  let kcal=v('energy-kcal');if(kcal===undefined){const kj=v('energy');if(kj!==undefined)kcal=kj/4.184}
  fill({name:p.product_name_en||p.product_name||p.product_name_fr||'',brand:String(p.brands||'').split(',')[0].trim(),serving:per?(p.serving_size||'1 serving'):'100 g',kcal,p:v('proteins'),c:v('carbohydrates'),f:v('fat'),fib:v('fiber')});
  st(per?'Found it in Open Food Facts. It’s a community database, so check the numbers against the label.':'Found it in Open Food Facts, but only per 100 g. Change the serving to match the label if you like.');
 }catch(e){st('Couldn’t reach the food database (are you offline?). Enter the numbers from the label.',true)}
}

/* ---------- sheet ---------- */
const SH={dest:'log',invId:null,edit:false};
const st=(m,err)=>{const s=$('#f-status');s.hidden=!m;s.textContent=m||'';s.classList.toggle('err',!!err)};
const F=['name','brand','code','serv','kcal','p','c','f','fib'];
function fill(o){const map={name:o.name,brand:o.brand,code:o.code,serv:o.serving,kcal:o.kcal,p:o.p,c:o.c,f:o.f,fib:o.fib};for(const k of F){const v=map[k];if(v!==null&&v!==undefined&&v!=='')$('#f-'+k).value=typeof v==='number'?g1(v):v}}
function readFood(){return{name:$('#f-name').value.trim(),brand:$('#f-brand').value.trim(),code:$('#f-code').value.replace(/\D/g,''),serving:$('#f-serv').value.trim(),kcal:num($('#f-kcal').value),p:num($('#f-p').value),c:num($('#f-c').value),f:num($('#f-f').value),fib:num($('#f-fib').value)}}
function setDest(d){SH.dest=d;$$('[data-a=dest]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===d));$('#d-log').hidden=d!=='log';$('#d-kit').hidden=d!=='kit';$('#pickwrap').hidden=d!=='log'||SH.edit||!S.inv.some(i=>i.qty>0);$('#f-save').textContent=SH.edit?'Save changes':d==='log'?'Log it':'Add to kitchen';$('#sh-t').textContent=SH.edit?'Edit item':d==='log'?'Log food':'Add to kitchen'}
function openSheet({dest='log',meal,inv}={}){
 for(const k of F)$('#f-'+k).value='';
 $('#f-sv').value='1';$('#f-qty').value='1';$('#f-exp').value='';$('#f-desc').value='';$('#descbox').hidden=true;st('');
 $('#labelbtn').hidden=!hasGem();$('.tools').style.gridTemplateColumns=hasGem()?'':'repeat(2,minmax(0,1fr))';
 $('#f-meal').value=meal||(S.tab==='today'&&S.day!==TODAY()?'Snacks':mealNow());
 SH.invId=null;SH.edit=false;$('#takewrap').hidden=true;
 $('#f-pick').innerHTML='<option value="">Choose an item…</option>'+S.inv.filter(i=>i.qty>0).sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(i=>`<option value="${esc(i.id)}">${esc(i.name)}${i.brand?' · '+esc(i.brand):''}</option>`).join('');
 if(inv){SH.invId=inv.id;SH.edit=true;fill(inv);$('#f-loc').value=LOCS.includes(inv.loc)?inv.loc:'Pantry';$('#f-qty').value=g1(inv.qty);$('#f-exp').value=inv.exp||''}
 setDest(inv?'kit':dest);$('#f-editacts').hidden=!inv;
 $('#scrim').classList.add('open');document.body.style.overflow='hidden';
}
function closeSheet(){$('#scrim').classList.remove('open');document.body.style.overflow=''}
async function handleLabel(file){
 st('Reading the label…');
 try{
  const img=await scaled(file,1400);URL.revokeObjectURL(img.url);
  const codeP=$('#f-code').value?Promise.resolve(null):decodePhoto(file);
  const j=await gemini('You read food packaging photos. From this photo of a Nutrition Facts table (and any packaging visible), return JSON: {"name":product name or null,"brand":brand or null,"serving":"serving size as printed, e.g. 3/4 cup (175 g)","kcal":number,"p":protein g,"c":total carbohydrate g,"f":total fat g,"fib":fibre g}. Values are for ONE serving exactly as printed. Use null for anything you cannot read.',img.blob);
  fill({name:j.name||undefined,brand:j.brand||undefined,serving:j.serving||undefined,kcal:j.kcal??undefined,p:j.p??undefined,c:j.c??undefined,f:j.f??undefined,fib:j.fib??undefined});
  const code=await codeP;if(code)$('#f-code').value=code;
  st('Filled in from the label. Check the numbers, then save'+($('#f-code').value?'; this product will be recognised next time you scan it.':'.'));
 }catch(e){st(errMsg(e),true)}
}
const descPrompt=t=>`Estimate the nutrition of this food as eaten: "${t.replace(/"/g,"'")}". Use typical values from USDA / Canadian Nutrient File data. Return JSON: {"name":short name,"serving":short description of the whole amount described,"kcal":number,"p":protein g,"c":carbs g,"f":fat g,"fib":fibre g} for the WHOLE amount described.`;
async function estimate(){
 const t=$('#f-desc').value.trim();if(!t){$('#f-desc').focus();return}
 if(!hasGem()){openClaude(descPrompt(t)+'\n\nAfter the JSON, add a one-line plain-English summary.');st('Claude will reply with the numbers. Type them into the fields below, then save.');return}
 st('Estimating…');
 try{const j=await gemini(descPrompt(t));fill({name:j.name,serving:j.serving,kcal:j.kcal,p:j.p,c:j.c,f:j.f,fib:j.fib});$('#f-sv').value='1';st('This is an estimate. Adjust it if you know better.')}
 catch(e){st(errMsg(e),true)}
}
function saveFood(){
 const food=readFood();
 if(!food.name){st('Give it a name first.',true);$('#f-name').focus();return}
 if(food.code){S.foods[food.code]={...food};save('foods',{map:S.foods})}
 if(SH.dest==='log'){
  const d=S.tab==='today'?S.day:TODAY(),undo=snap(d);
  const sv=Math.max(.05,num($('#f-sv').value)||1),meal=$('#f-meal').value;
  day(d).push({id:nid(),...food,sv,meal,t:Date.now()});saveDay(d);
  if(SH.invId&&$('#f-take').checked)dec(SH.invId,sv);
  toast(`Logged ${food.name} to ${meal}`,undo);
 }else{
  const it={...food,loc:$('#f-loc').value,qty:Math.max(0,num($('#f-qty').value)),exp:$('#f-exp').value||''};
  const ex=SH.edit&&S.inv.find(i=>i.id===SH.invId);
  if(ex){Object.assign(ex,it);delete ex.sample}else S.inv.push({id:nid(),...it,added:TODAY()});
  saveInv();toast(ex?'Saved':`Added ${food.name} to ${it.loc}`);
 }
 closeSheet();render();
}

/* ---------- actions ---------- */
function snap(d){const inv=JSON.stringify(S.inv),lg=JSON.stringify(day(d));return()=>{S.inv=JSON.parse(inv);S.logs[d]=JSON.parse(lg);saveInv();saveDay(d);render();toast('Undone')}}
function dec(id,n){const it=S.inv.find(i=>i.id===id);if(it){it.qty=Math.max(0,Math.round((it.qty-n)*100)/100);saveInv()}}
let tt,undoFn=null;
function toast(m,undo){const t=$('#toast');t.innerHTML=`<span>${esc(m)}</span>${undo?'<button class="btn sm" data-a="undo">Undo</button>':''}`;undoFn=undo||null;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),5500)}
const tot=L=>L.reduce((s,e)=>{for(const k of ['kcal','p','c','f','fib'])s[k]+=num(e[k])*num(e.sv||1);return s},{kcal:0,p:0,c:0,f:0,fib:0});
const bar=(v,g)=>{const pct=g?Math.min(100,v/g*100):0;return `<div class="bar"><i class="${g&&v>g?'ov':''}" style="width:${pct.toFixed(1)}%"></i></div>`};
const svTxt=e=>num(e.sv)===1?(e.serving||'1 serving'):`${g1(e.sv)} × ${e.serving||'serving'}`;

const SAMPLE=[['Large eggs','1 egg (50 g)',72,6.3,.4,4.8,0,'Fridge',12,14],['Plain Greek yogurt, 0%','3/4 cup (175 g)',100,17,6,.7,0,'Fridge',4,5],['Chicken breast','100 g raw',120,22.5,0,2.6,0,'Fridge',6,2],['Baby spinach','2 cups (60 g)',14,1.7,2.2,.2,1.3,'Fridge',3,1],['Cheddar','30 g',120,7,.4,10,0,'Fridge',8,20],['Brown rice','1/4 cup dry (45 g)',165,3.5,34,1.4,1.6,'Pantry',18,0],['Rolled oats','1/2 cup (40 g)',150,5,27,2.5,4,'Pantry',15,0],['Black beans, canned','1/2 cup (130 g)',110,7,20,.5,7,'Pantry',3.5,0],['Frozen mixed berries','1 cup (140 g)',70,1,17,.5,4,'Freezer',5,0]];

function backupText(){const logs={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(K+'log-'))logs[k.slice(K.length+4)]=load(k.slice(K.length),{entries:[]}).entries}return JSON.stringify({app:'larder',v:2,inv:S.inv,foods:S.foods,goals:S.goals,weights:S.weights,profile:S.prof,burn:S.burn,logs})}

document.addEventListener('click',e=>{
 if(e.target.id==='scrim'){closeSheet();return}
 if(e.target.id==='bscrim'){closeBurn();return}
 const b=e.target.closest('[data-a]');if(!b)return;

/* ---------- goal planner ---------- */
const ACTS=[['1.2','Mostly sitting (desk job)'],['1.375','Lightly active (on my feet some of the day)'],['1.55','Active (on my feet most of the day)'],['1.725','Very physical job']];
function macros(kcal,kg){kcal=Math.round(kcal/10)*10;kg=kg||65;const p=Math.round(Math.min(1.8*kg,.35*kcal/4)),f=Math.round(Math.max(.27*kcal/9,.6*kg)),c=Math.max(0,Math.round((kcal-p*4-f*9)/4)),fib=Math.max(21,Math.round(kcal/1000*14));return{kcal,p,c,f,fib}}
function makePlan(){
 const P=S.prof,kg=num(P.cur),goal=num(P.goal),age=num(P.age),h=num(P.h),act=num(P.act)||1.2,miss=[];
 if(!P.sex)miss.push('sex');if(!age)miss.push('age');if(!h)miss.push('height');if(!kg)miss.push('weight today');if(!goal)miss.push('goal weight');if(!P.date)miss.push('date');
 if(miss.length)return{err:'Fill in your '+miss.join(', ')+' first.'};
 if(age<18)return{err:'This calculator is made for adults. For under-18s, a doctor or dietitian should set targets.'};
 const days=Math.round((parseD(P.date)-parseD(TODAY()))/864e5);
 if(days<7)return{err:'Pick a date at least a week from today.'};
 const bmr=10*kg+6.25*h-5*age+(P.sex==='m'?5:P.sex==='f'?-161:-78),tdee=bmr*act,floor=P.sex==='m'?1500:P.sex==='f'?1200:1350;
 const lose=kg-goal,r={bmr,tdee,floor,days,lose,kg,goal,flags:[]};
 const bmi=goal/((h/100)**2);
 if(bmi<18.5)r.flags.push(`A goal of ${wt(goal)} is a BMI of ${g1(bmi)} for your height, below the healthy range (18.5 to 24.9). It’s worth checking that goal with your doctor.`);
 if(lose<=0){r.maint=true;r.rec=tdee;return r}
 r.perWeek=lose/(days/7);r.need=Math.round(tdee-lose*7700/days);
 const maxWeek=Math.min(1,kg*.01);
 if(r.perWeek>maxWeek+1e-9)r.flags.unshift(`Losing ${wt(r.perWeek)} a week is faster than the usual guideline of 0.5 to 1 kg (1 to 2 lb) a week, or about 1% of your body weight (${wt(maxWeek)} for you).`);
 if(r.need<floor)r.flags.splice(r.perWeek>maxWeek?1:0,0,r.need<=0?`It would take a daily deficit bigger than all the calories you burn (about ${fmt(tdee)} a day), so it isn’t possible by eating less, and trying would be unsafe.`:`It would mean eating about ${fmt(r.need)} calories a day. That’s below the common minimum of ${fmt(floor)} a day${P.sex==='x'?'':P.sex==='m'?' for men':' for women'}, which makes it hard to get enough nutrients and keep your muscle.`);
 const safeCal=Math.max(floor,Math.round(tdee-maxWeek*7700/7)),def=tdee-safeCal;
 r.safe={kcal:safeCal,perWeek:def*7/7700,eta:def>20?addD(TODAY(),Math.ceil(lose*7700/def)):null};
 r.mine=r.need>=floor?r.need:null;
 r.rec=r.flags.length?safeCal:r.need;
 return r;
}
const wt=kg=>S.goals.unit==='lb'?g1(kg*LB)+' lb':g1(kg)+' kg';
const longDate=k=>parseD(k).toLocaleDateString(undefined,{month:'long',day:'numeric',year:parseD(k).getFullYear()!==new Date().getFullYear()?'numeric':undefined});
function planHTML(){
 const r=S.plan;if(!r)return '';if(r.err)return `<p class="status err">${esc(r.err)}</p>`;
 const M=macros(r.rec,r.kg),mac=`<div class="macros"><span>Protein <b>${M.p}</b> g</span><span>Carbs <b>${M.c}</b> g</span><span>Fat <b>${M.f}</b> g</span><span>Fibre <b>${M.fib}</b> g</span></div>`;
 const warn=r.flags.length?`<div class="warn"><b>${r.perWeek&&(r.perWeek>Math.min(1,r.kg*.01)||r.need<r.floor)?'This pace may be too aggressive':'Worth a second look'}</b><ul>${r.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:'';
 const foot=`<p class="meta" style="margin-top:12px">Estimated with the Mifflin-St Jeor formula. Real needs can differ by about 10%, so watch your weekly weight trend and adjust. Talk to a doctor or dietitian before a big change, especially if you have a health condition.</p>`;
 if(r.maint)return `${warn}<div class="kv"><span>Maintenance (estimated)</span><b>${fmt(r.tdee)} cal</b></div><p style="margin-top:10px">Your goal is at or above your weight today, so this keeps you steady.</p><div class="recbig">${fmt(M.kcal)} <span>cal a day</span></div>${mac}<button class="btn pri wide" data-a="useplan" data-k="${M.kcal}">Use these goals</button>${foot}`;
 const eta=r.flags.length?(r.safe.eta?`<p>At this intake you’d lose about <b>${wt(r.safe.perWeek)} a week</b> and reach ${wt(r.goal)} around <b>${esc(longDate(r.safe.eta))}</b>, instead of ${esc(longDate(S.prof.date))}.</p>`:`<p>At the minimum intake you’d be in only a small deficit. More daily movement, plus burned calories from Health, is the safest way to make progress.</p>`):`<p class="ok">That pace is within the usual guideline.</p>`;
 return `<div class="kv"><span>Maintenance (estimated)</span><b>${fmt(r.tdee)} cal a day</b></div>
 <div class="kv"><span>To lose ${wt(r.lose)} by ${esc(longDate(S.prof.date))}</span><b>${wt(r.perWeek)} a week · ${r.need>0?fmt(r.need)+' cal a day':'not reachable by diet'}</b></div>
 ${warn}${r.flags.length?'':eta}
 <h4 style="margin-top:14px">${r.flags.length?'Safer plan':'Your plan'}</h4>
 <div class="recbig">${fmt(M.kcal)} <span>cal a day</span></div>${mac}
 ${r.flags.length?eta:''}
 <button class="btn pri wide" data-a="useplan" data-k="${M.kcal}">Use ${fmt(M.kcal)} cal and these macros</button>
 ${r.flags.length&&r.mine?`<button class="btn ghost wide" style="margin-top:6px" data-a="useplan" data-k="${r.mine}">Use ${fmt(Math.round(r.mine/10)*10)} cal for my date anyway</button>`:''}
 ${r.flags.length&&!r.mine?`<p class="meta" style="margin-top:8px">Larder won’t set a goal below the ${fmt(r.floor)}-calorie minimum.</p>`:''}${foot}`;
}
