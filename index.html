<style>
/* VOICE: practical, encouraging kitchen companion for steady weight loss
   IDEA: the printed Nutrition Facts panel: heavy black rules, condensed black type
   PICTURE: today's live label: calories left, macro bars
   COLOUR and TYPE: white label + black ink, tomato accent, leaf green for fresh food; Archivo condensed / Archivo
   LAYOUT: one-column phone app, bottom tab bar, sheets slide up */
:root{color-scheme:light dark;--bg:light-dark(#fff,#121211);--ink:light-dark(#111,#f1efe9);--mute:light-dark(#5f5d58,#a8a49b);--soft:light-dark(#f2f0eb,#1f1e1c);--line:light-dark(#d9d6cf,#363430);--acc:light-dark(#d23b1d,#ff6c4c);--leaf:light-dark(#2d7a3c,#66c578);--warn:light-dark(#9a6200,#f0b23c);--ice:light-dark(#2463b5,#82b3f2)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));max-width:720px;margin:0 auto}
.brand{font-weight:900;font-stretch:68%;font-size:30px;line-height:1}
.sync{font-size:13px;color:var(--mute);text-align:right}
main{max-width:720px;margin:0 auto;padding:0 16px}
h2{font-weight:900;font-stretch:70%;font-size:34px;line-height:1.05;margin:22px 0 10px;text-wrap:balance}
h3{font-weight:900;font-stretch:78%;font-size:21px;line-height:1.1;margin:0}
h4{font-size:14px;margin:12px 0 4px}
p{margin:6px 0}
.meta,.none{font-size:13px;color:var(--mute)}
.none{margin:8px 0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
button,.btn{font:inherit;font-weight:700;font-size:16px;min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;text-decoration:none;white-space:nowrap}
button:disabled{opacity:.45;cursor:default}
.pri{background:var(--ink);color:var(--bg)}
.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.sm{min-height:40px;padding:0 12px;font-size:14px}
.ghost{border-color:transparent;background:none}
.wide{width:100%;margin-top:14px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label:focus-within{outline:none}
.btn:has(input:focus-visible){outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
textarea{resize:vertical}
.f{display:block;font-size:13px;font-weight:700;color:var(--mute)}
.f>span{display:block;margin-bottom:4px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.span2{grid-column:1/-1}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1 1 160px;width:auto}
.panel{border:1.5px solid var(--line);border-radius:14px;padding:14px}
/* the label */
.label{border:2px solid var(--ink);padding:8px 12px 12px}
.label h1{font-weight:900;font-stretch:62%;font-size:clamp(38px,11vw,52px);line-height:1;margin:0}
.daynav{display:flex;align-items:center;gap:4px;margin:2px 0 6px}
.ic{min-height:40px;width:40px;padding:0;border:0;background:none;font-size:24px}
.daytxt{font-weight:700;font-size:15px}
.r10{border-top:10px solid var(--ink)}.r5{border-top:5px solid var(--ink);margin-top:10px}
.calrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:8px 0 2px}
.calrow .k{font-weight:900;font-stretch:80%;font-size:24px;line-height:1.1}
.big{font-weight:900;font-stretch:66%;font-size:clamp(58px,17vw,84px);line-height:.85;font-variant-numeric:tabular-nums}
.over{color:var(--acc)}
.bar{height:8px;background:var(--soft);position:relative;overflow:hidden;margin:6px 0 0;border-radius:1px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar i.ov{background:var(--acc)}
.mrow{padding:8px 0 6px;border-top:1px solid var(--ink)}
.mrow:first-of-type{border-top:0}
.mrow .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mrow .g{color:var(--mute);white-space:nowrap;font-size:14px}
.cta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 4px}
.meal{margin-top:20px}
.mh{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--ink);padding-bottom:2px}
.mh h3{flex:1}
.entry{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.entry .n{flex:1;font-weight:600}
.entry small{display:block;color:var(--mute);font-size:13px;font-weight:400}
.kc{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.x{width:44px;min-height:44px;padding:0;border:0;background:none;color:var(--mute);font-size:22px;flex:none}
/* kitchen */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chip{border-radius:999px;flex:none;min-height:40px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.cnt{font-weight:400;opacity:.7}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.nm{font-weight:800;font-size:17px}
.loc{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;border:1.5px solid currentColor;vertical-align:2px;margin-left:4px}
.loc.Pantry{color:var(--warn)}.loc.Fridge{color:var(--leaf)}.loc.Freezer{color:var(--ice)}
.tag{font-size:11px;font-weight:700;color:var(--mute);border:1px dashed var(--mute);border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:2px}
.exp{font-size:13px;font-weight:700;white-space:nowrap;text-align:right}
.exp.soon{color:var(--acc)}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px}
.stepper button{border:0;min-height:40px;width:40px;padding:0;background:none;font-size:20px}
.stepper span{min-width:3.2ch;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.empty{padding:26px 18px;text-align:center;border:2px dashed var(--line);border-radius:14px;color:var(--mute);margin-top:12px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.empty .row{justify-content:center;margin-top:12px}
/* meals */
.idea{border:2px solid var(--ink);border-radius:14px;padding:14px 16px;margin:14px 0}
.ih{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.macros{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;margin:8px 0 0}
.macros b{font-size:18px;font-variant-numeric:tabular-nums}
.idea ul,.idea ol{margin:4px 0;padding-left:20px;font-size:15px}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.skel{height:150px;border-radius:14px;margin:14px 0;background:linear-gradient(90deg,var(--soft) 20%,var(--line) 50%,var(--soft) 80%);background-size:250% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
.status{font-size:14px;padding:10px 12px;background:var(--soft);border-radius:10px;margin:12px 0 0}
.status.err{color:var(--acc)}
/* progress */
.wk{display:grid;grid-template-columns:3.2em minmax(0,1fr) 5.5em;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.wk .bar{margin:0;height:14px}
.wk .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fig{position:relative;min-height:200px;margin:12px 0 4px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wl{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:15px}
.presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg.full{display:flex;margin-top:16px}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);z-index:20}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:13px;font-weight:700;color:var(--mute);text-decoration:none;min-height:58px}
.tabs a[aria-current=page]{color:var(--ink)}
.tabs svg{width:24px;height:24px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:6px 16px calc(22px + env(safe-area-inset-bottom));border-top:2px solid var(--ink);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.skel{animation:none}}
.shh{display:flex;align-items:center;justify-content:space-between}
.shh h2{margin:10px 0}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{flex-direction:column;min-height:76px;font-size:14px;line-height:1.15;white-space:normal;text-align:center;padding:8px}
.tool svg{width:26px;height:26px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 16px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px);font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.toast span{padding:8px 0}
@media (max-width:440px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.h-hide{display:none}}
</style>
<style>
.scanner{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;color:#fff}
.scanner[hidden]{display:none}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:relative;width:min(82vw,360px);aspect-ratio:1.7;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax rgb(0 0 0/.45)}
.reticle::after{content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff6c4c;animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-34px)}to{transform:translateY(34px)}}
@media (prefers-reduced-motion:reduce){.reticle::after{animation:none}}
.scanbar{position:absolute;left:0;right:0;bottom:0;padding:16px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:center}
.scanbar p{margin:0;font-weight:700;text-shadow:0 1px 6px #000;text-align:center}
.scanner .btn{background:#fff;color:#111;border-color:#fff}
.scanner .btn.ghost{background:rgb(0 0 0/.35);color:#fff;border-color:#fff}
.reply{margin-top:12px}
.ai-src{display:grid;gap:8px;margin-top:10px}
</style>
</head><body>
<header class="top"><div class="brand">Larder</div><div class="sync" id="sync"></div></header>
<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
 <a href="#today" data-t="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M4 8h16M8 12h8M8 16h5"/></svg>Today</a>
 <a href="#kitchen" data-t="kitchen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M5 9h14M9 5v2M9 12v4"/></svg>Kitchen</a>
 <a href="#meals" data-t="meals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>Meals</a>
 <a href="#progress" data-t="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M4 16l5-5 4 3 7-8"/></svg>Progress</a>
</nav>

<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
 <div class="shh"><h2 id="sh-t">Add food</h2><button class="x" data-a="close" aria-label="Close">×</button></div>
 <div class="tools">
  <button class="btn tool" data-a="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5v14M6 5v14M10 5v14M12 5v14M15 5v14M19 5v14M21 5v14"/></svg>Scan barcode</button>
  <label class="btn tool" id="labelbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20"/><path d="M5 7h14M8 11h8M8 14h8M8 17h5"/></svg>Photo of label<input type="file" accept="image/*" capture="environment" class="vh" id="in-label"></label>
  <button class="btn tool" data-a="describe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>Describe it</button>
 </div>
 <div id="descbox" hidden style="margin-top:10px"><label class="f"><span>What is it, and how much?</span><textarea id="f-desc" rows="2" placeholder="2 scrambled eggs with a slice of buttered whole-wheat toast"></textarea></label><button class="btn pri wide" data-a="estimate" style="margin-top:8px">Estimate nutrition</button><p class="meta" id="desc-hint"></p></div>
 <div class="status" id="f-status" hidden></div>
 <div id="pickwrap" style="margin-top:12px"><label class="f"><span>Or pick from your kitchen</span><select id="f-pick"></select></label>
  <label class="chk" id="takewrap" hidden><input type="checkbox" id="f-take" checked> Take it out of my kitchen</label></div>
 <div class="grid2">
  <label class="f span2"><span>Name</span><input id="f-name" autocomplete="off"></label>
  <label class="f"><span>Brand</span><input id="f-brand" autocomplete="off"></label>
  <label class="f"><span>Barcode</span><input id="f-code" inputmode="numeric" autocomplete="off"></label>
  <label class="f span2"><span>Serving size</span><input id="f-serv" placeholder="e.g. 3/4 cup (175 g)"></label>
 </div>
 <div class="g5">
  <label class="f"><span>Calories</span><input id="f-kcal" type="number" inputmode="decimal" min="0"></label>
  <label class="f"><span>Protein g</span><input id="f-p" type="number" inputmode="decimal" min="0" step="0.1"></label>
  <label class="f"><span>Carbs g</span><input id="f-c" type="number" inputmode="decimal" min="0" step="0.1"></label>
  <label class="f"><span>Fat g</span><input id="f-f" type="number" inputmode="decimal" min="0" step="0.1"></label>
  <label class="f"><span>Fibre g</span><input id="f-fib" type="number" inputmode="decimal" min="0" step="0.1"></label>
 </div>
 <p class="meta">Per one serving.</p>
 <div class="seg full" role="group" aria-label="Where it goes"><button data-a="dest" data-d="log">Log it</button><button data-a="dest" data-d="kit">Add to kitchen</button></div>
 <div id="d-log" class="grid2">
  <label class="f"><span>Meal</span><select id="f-meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select></label>
  <label class="f"><span>Servings eaten</span><input id="f-sv" type="number" inputmode="decimal" min="0" step="0.25" value="1"></label>
 </div>
 <div id="d-kit" class="grid2">
  <label class="f"><span>Kept in</span><select id="f-loc"><option>Pantry</option><option>Fridge</option><option>Freezer</option></select></label>
  <label class="f"><span>Servings on hand</span><input id="f-qty" type="number" inputmode="decimal" min="0" step="0.5" value="1"></label>
  <label class="f span2"><span>Best before (optional)</span><input id="f-exp" type="date"></label>
 </div>
 <button class="btn pri wide" data-a="savefood" id="f-save">Save</button>
</div></div>

<div class="scanner" id="scanner" hidden>
 <video id="scan-v" playsinline muted></video>
 <div class="reticle" aria-hidden="true"></div>
 <div class="scanbar"><p id="scan-msg">Line up the barcode inside the box</p>
  <div class="row"><button class="btn" data-a="stopscan">Cancel</button><label class="btn ghost">Use a photo<input type="file" accept="image/*" class="vh" id="in-scanphoto"></label></div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:0};
const fmt=n=>Math.round(num(n)).toLocaleString();
const g1=n=>{const r=Math.round(num(n)*10)/10;return r%1?r.toFixed(1):String(r)};
const nid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseD=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addD=(k,n)=>{const d=parseD(k);d.setDate(d.getDate()+n);return dkey(d)};
const TODAY=()=>dkey(new Date());
const MEALS=['Breakfast','Lunch','Dinner','Snacks'],LOCS=['Pantry','Fridge','Freezer'];
const mealNow=()=>{const n=new Date(),h=n.getHours()+n.getMinutes()/60;return h<10.5?'Breakfast':h<15?'Lunch':h<20.5?'Dinner':'Snacks'};
const daysTo=k=>k?Math.round((parseD(k)-parseD(TODAY()))/864e5):null;
const LB=2.20462;
const STANDALONE=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

const S={inv:[],foods:{},goals:{kcal:1800,p:130,c:180,f:60,fib:28,unit:'kg'},set:{gemKey:'',gemModel:'gemini-2.5-flash'},weights:[],logs:{},day:TODAY(),tab:'today',loc:'All',q:'',ideas:null,ideaErr:'',busy:false,mopt:{meal:mealNow(),n:'1',fit:true,exp:true,strict:false,note:''}};

/* ---------- storage: this phone ---------- */
const K='larder:';
const load=(k,def)=>{try{const v=localStorage.getItem(K+k);if(v)return JSON.parse(v)}catch(e){}return def};
const save=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){toast('Phone storage is full. Delete some old items or make a backup.')}};
const saveInv=()=>save('inv',{items:S.inv});
const saveDay=k=>save('log-'+k,{entries:S.logs[k]||[]});
const saveGoals=()=>save('goals',S.goals);
const saveW=()=>save('weights',{list:S.weights});
const saveSet=()=>save('settings',S.set);
function day(k){if(!S.logs[k]){const d=load('log-'+k,{entries:[]});S.logs[k]=Array.isArray(d.entries)?d.entries:[]}return S.logs[k]}

/* ---------- AI: Claude app hand-off, or Gemini free tier ---------- */
const hasGem=()=>!!S.set.gemKey;
function b64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})}
async function gemini(prompt,img){
 if(!hasGem())throw{code:'nokey'};
 const parts=[{text:prompt+'\n\nRespond with only the JSON object.'}];
 if(img)parts.push({inline_data:{mime_type:'image/jpeg',data:await b64(img)}});
 let r;
 try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.set.gemModel||'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(S.set.gemKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:.7}})})}catch(e){throw{code:'offline'}}
 if(r.status===429)throw{code:'rate_limited'};
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw{code:'api',message:(j.error&&j.error.message)||('HTTP '+r.status)};
 const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
 return parseJSON(t);
}
function parseJSON(t){t=String(t||'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw{code:'parse'};return JSON.parse(t.slice(a,b+1))}
const errMsg=e=>e&&e.code==='nokey'?'Add a free Gemini key in Progress → Meal ideas helper to use this.':e&&e.code==='rate_limited'?'Gemini’s free limit is used up for now. Try again later, or use the Claude app.':e&&e.code==='offline'?'You’re offline. Try again when you have a connection.':e&&e.code==='api'?'Gemini said: '+e.message:'That didn’t work. Try again, or fill the numbers in by hand.';
function openClaude(prompt){
 let ok=true;
 try{navigator.clipboard.writeText(prompt).catch(()=>{ok=false})}catch(e){ok=false}
 const url='https://claude.ai/new?q='+encodeURIComponent(prompt.slice(0,12000));
 const w=window.open(url,'_blank');if(!w)location.href=url;

}

/* ---------- images & barcodes ---------- */
function scaled(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,url:URL.createObjectURL(b)}):rej(),'image/jpeg',.88)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function hints(hard){const Z=window.ZXing,h=new Map();if(hard)h.set(Z.DecodeHintType.TRY_HARDER,true);h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);return h}
async function decodePhoto(file){
 if(!window.ZXing)return null;
 for(const size of [1400,900,2000]){let img;try{img=await scaled(file,size);const r=await new ZXing.BrowserMultiFormatReader(hints(true)).decodeFromImageUrl(img.url);if(r)return r.getText()}catch(e){}finally{if(img)URL.revokeObjectURL(img.url)}}
 return null;
}
let reader=null,scanDone=false;
async function startScan(){
 if(!window.ZXing){st('The scanner didn’t load. Close and reopen the app.',true);return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st('This browser can’t use the camera. Open Larder from your Home Screen, or type the barcode number.',true);return}
 scanDone=false;$('#scanner').hidden=false;$('#scan-msg').textContent='Line up the barcode inside the box';
 reader=new ZXing.BrowserMultiFormatReader(hints(false),200);
 try{
  await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},$('#scan-v'),(res)=>{if(res&&!scanDone){scanDone=true;const code=res.getText();stopScan();gotCode(code)}});
 }catch(e){stopScan();st(e&&e.name==='NotAllowedError'?'Camera access is off. Turn it on in Settings › Safari › Camera (or for Larder), then try again. You can also type the barcode number.':'Couldn’t start the camera. Try “Use a photo”, or type the barcode number.',true)}
}
function stopScan(){try{reader&&reader.reset()}catch(e){}reader=null;const v=$('#scan-v');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}$('#scanner').hidden=true}
async function gotCode(code){
 code=String(code).replace(/\D/g,'');if(!code)return;
 $('#f-code').value=code;
 const k=S.foods[code];
 if(k){fill({...k,code});st(`Found ${k.name} in your saved products.`);return}
 await lookupOFF(code);
}
async function lookupOFF(code){
 st(`Looking up ${code}…`);
 try{
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,product_name_fr,brands,serving_size,nutriments`);
  let j=await r.json();
  if((j.status!==1||!j.product)&&code.length===12){const r2=await fetch(`https://world.openfoodfacts.org/api/v2/product/0${encodeURIComponent(code)}.json?fields=product_name,product_name_en,product_name_fr,brands,serving_size,nutriments`);j=await r2.json()}
  if(j.status!==1||!j.product){st(`${code} isn’t in the Open Food Facts database yet. ${hasGem()?'Tap “Photo of label” and I’ll read it, or enter':'Enter'} the numbers from the label; it’ll be remembered next time you scan it.`);return}
  const p=j.product,n=p.nutriments||{},per=n['energy-kcal_serving']!=null||n['proteins_serving']!=null;
  const v=k=>{const x=n[k+(per?'_serving':'_100g')];return x==null?undefined:num(x)};
  let kcal=v('energy-kcal');if(kcal===undefined){const kj=v('energy');if(kj!==undefined)kcal=kj/4.184}
  fill({name:p.product_name_en||p.product_name||p.product_name_fr||'',brand:String(p.brands||'').split(',')[0].trim(),serving:per?(p.serving_size||'1 serving'):'100 g',kcal,p:v('proteins'),c:v('carbohydrates'),f:v('fat'),fib:v('fiber')});
  st(per?'Found it in Open Food Facts. It’s a community database, so check the numbers against the label.':'Found it in Open Food Facts, but only per 100 g. Change the serving to match the label if you like.');
 }catch(e){st('Couldn’t reach the food database (are you offline?). Enter the numbers from the label.',true)}
}

function cleanIdeas(j){return (Array.isArray(j&&j.ideas)?j.ideas:[]).slice(0,5).map(x=>({title:String(x.title||'Idea'),minutes:num(x.minutes),why:String(x.why||''),uses:(Array.isArray(x.uses)?x.uses:[]).map(u=>({id:String(u.id||''),name:String(u.name||''),servings:num(u.servings)})),buy:(Array.isArray(x.buy)?x.buy:[]).map(String),steps:(Array.isArray(x.steps)?x.steps:[]).map(String),kcal:num(x.kcal),p:num(x.p),c:num(x.c),f:num(x.f),fib:num(x.fib)}))}
async function suggest(){
 if(S.busy)return;S.busy=true;S.ideaErr='';render();
 try{S.ideas=cleanIdeas(await gemini(mealPrompt(false)));save('ideas',S.ideas);if(!S.ideas.length)S.ideaErr='No ideas came back. Try again.'}
 catch(e){S.ideaErr=errMsg(e)}
 S.busy=false;render();
}
function useReply(){
 const t=$('#reply-in').value;const m=t.search(/\{\s*"ideas"/);
 try{if(m<0)throw 0;const ideas=cleanIdeas(JSON.parse(t.slice(m,t.lastIndexOf('}')+1)));if(!ideas.length)throw 0;S.ideas=ideas;S.ideaErr='';S.showPaste=false;save('ideas',S.ideas);render();toast('Ideas added')}
 catch(e){toast('I couldn’t find the ideas code in that. Copy Claude’s whole reply, including the code block at the end.')}
}
function logIdea(i){
 const x=S.ideas&&S.ideas[i];if(!x)return;const d=TODAY(),u=snap(d);
 day(d).push({id:nid(),name:x.title,serving:'1 portion',kcal:x.kcal,p:x.p,c:x.c,f:x.f,fib:x.fib,sv:1,meal:S.mopt.meal,t:Date.now()});saveDay(d);
 let n=0;for(const k of x.uses){if(S.inv.some(it=>it.id===k.id)&&k.servings>0){dec(k.id,k.servings);n++}}
 render();toast(`Logged ${x.title}${n?`, used ${n} item${n>1?'s':''}`:''}`,u);
}

}
function kitchenList(){
 if(!S.inv.length)return `<div class="empty"><b>Your kitchen is empty</b>Scan or add what’s in your pantry, fridge and freezer. Meal ideas are built from it.<div class="row"><button class="btn pri" data-a="scankit">Scan an item</button><button class="btn" data-a="sample">Try a sample kitchen</button></div></div>`;
 const q=S.q.trim().toLowerCase();

 xs.sort((a,b)=>{const o=(b.qty>0)-(a.qty>0);if(o)return o;const ea=a.exp||'9',eb=b.exp||'9';return ea<eb?-1:ea>eb?1:String(a.name).localeCompare(String(b.name))});

 return (xs.map(i=>{const d=daysTo(i.exp),loc=LOCS.includes(i.loc)?i.loc:'Pantry';const et=d===null?'':d<0?'Expired':d===0?'Use today':d===1?'Tomorrow':d<=7?`${d} days`:parseD(i.exp).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return `<div class="item"><div><div class="nm">${esc(i.name)}<span class="loc ${loc}">${loc}</span>${i.sample?'<span class="tag">Sample</span>':''}</div><div class="meta">${i.brand?esc(i.brand)+' · ':''}${esc(i.serving||'1 serving')}: ${fmt(i.kcal)} cal · P ${g1(i.p)} · C ${g1(i.c)} · F ${g1(i.f)}</div></div><div class="exp ${d!==null&&d<=3?'soon':''}">${esc(et)}</div>
  <div class="acts"><span class="stepper"><button data-a="dec" data-id="${esc(i.id)}" aria-label="One fewer ${esc(i.name)}">−</button><span>${i.qty>0?g1(i.qty):'Out'}</span><button data-a="inc" data-id="${esc(i.id)}" aria-label="One more ${esc(i.name)}">+</button></span><button class="btn sm" data-a="eat" data-id="${esc(i.id)}" ${i.qty>0?'':'disabled'}>Eat one</button><button class="btn sm ghost" data-a="edit" data-id="${esc(i.id)}">Edit</button><button class="btn sm ghost" data-a="rminv" data-id="${esc(i.id)}">Delete</button></div></div>`}).join('')||'<p class="none">Nothing matches.</p>')+(hasS?'<p class="meta" style="margin-top:14px">Items tagged Sample are examples. <button class="btn sm ghost" data-a="clearsample">Remove samples</button></p>':'');

function vKitchen(){
 const n=l=>l==='All'?S.inv.length:l==='Expiring'?S.inv.filter(i=>i.exp&&daysTo(i.exp)<=3).length:S.inv.filter(i=>i.loc===l).length;
 return `<h2>Kitchen</h2>

function vMeals(){
 const o=S.mopt,rem=remaining(),have=S.inv.filter(i=>i.qty>0).length;
 const ideas=S.busy?'<div class="skel"></div><div class="skel"></div><div class="skel"></div>':S.ideaErr?`<p class="status err">${esc(S.ideaErr)}</p>`:!S.ideas||!S.ideas.length?(have?'':'<div class="empty"><b>Stock your kitchen first</b>Ideas are built from what you have. <div class="row"><a class="btn pri" href="#kitchen">Go to Kitchen</a></div></div>'):`<h2 style="font-size:26px">Your ideas</h2>`+S.ideas.map((x,i)=>{const owned=x.uses.filter(u=>S.inv.some(it=>it.id===u.id));return `<article class="idea"><div class="ih"><h3>${esc(x.title)}</h3><span class="meta">${x.minutes?fmt(x.minutes)+' min':''}</span></div>

  ${owned.length?`<h4>From your kitchen</h4><ul>${owned.map(u=>`<li>${esc(u.name)}: ${g1(u.servings)} serving${u.servings==1?'':'s'}</li>`).join('')}</ul>`:''}
  ${x.buy.length?`<h4>You’d also need</h4><ul>${x.buy.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}

  <div class="ai-src">
   <button class="btn acc" data-a="askclaude">Ask Claude for ideas</button>

  </div>

let ro=null;
function vProgress(){
 const G=S.goals,t=TODAY(),days=[...Array(7)].map((_,i)=>addD(t,i-6));
 const vals=days.map(d=>tot(day(d)).kcal),logged=vals.filter(v=>v);const max=Math.max(G.kcal,...vals)*1.05||1;
 const u=G.unit==='lb'?'lb':'kg',m=u==='lb'?LB:1,ws=S.weights;
 const ch=ws.length>1?(ws[ws.length-1].kg-ws[0].kg)*m:null;
 return `<h2>Goals</h2><div class="panel">
  <div class="g5" style="margin-top:0">${[['kcal','Calories'],['p','Protein g'],['c','Carbs g'],['f','Fat g'],['fib','Fibre g']].map(([k,l])=>`<label class="f"><span>${l}</span><input type="number" inputmode="numeric" min="0" data-goal="${k}" value="${esc(G[k])}"></label>`).join('')}</div>
  <div class="presets"><span>Split ${fmt(G.kcal)} cal:</span><button class="btn sm" data-a="split" data-s="30,40,30">Balanced</button><button class="btn sm" data-a="split" data-s="40,30,30">High protein</button><button class="btn sm" data-a="split" data-s="35,25,40">Lower carb</button></div>
  <p class="meta" style="margin-top:10px">Eating about 500 calories under maintenance usually means roughly 0.5 kg (1 lb) lost a week. A doctor or dietitian can set targets that fit you.</p></div>
 <h2>Last 7 days</h2><div class="panel">${days.map((d,i)=>`<div class="wk"><span>${parseD(d).toLocaleDateString(undefined,{weekday:'short'})}</span><div class="bar"><i class="${vals[i]>G.kcal?'ov':''}" style="width:${vals[i]?(vals[i]/max*100).toFixed(1):0}%"></i></div><span class="v">${vals[i]?fmt(vals[i]):'–'}</span></div>`).join('')}
  <p class="meta">${logged.length?`Average ${fmt(logged.reduce((a,b)=>a+b,0)/logged.length)} cal on ${logged.length} logged day${logged.length>1?'s':''} · goal ${fmt(G.kcal)}`:'Log food to see your week.'}</p></div>
 <h2>Weight</h2><div class="panel">
  <div class="row"><input id="w-in" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Today’s weight" aria-label="Today’s weight"><span class="seg"><button data-a="unit" data-u="kg" aria-pressed="${u==='kg'}">kg</button><button data-a="unit" data-u="lb" aria-pressed="${u==='lb'}">lb</button></span><button class="btn pri" data-a="addw">Save</button></div>
  ${ch!==null?`<p style="margin-top:12px"><b class="${ch>0?'over':''}">${ch>0?'+':ch<0?'−':''}${g1(Math.abs(ch))} ${u}</b> since ${parseD(ws[0].d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</p>`:''}
  <div class="fig" id="wfig"><svg id="wsvg" role="img" aria-label="Weight trend"></svg></div>
  ${ws.slice(-5).reverse().map(w=>`<div class="wl"><span>${parseD(w.d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</span><span><b>${g1(w.kg*m)}</b> ${u}<button class="x" data-a="rmw" data-d="${esc(w.d)}" aria-label="Delete">×</button></span></div>`).join('')}</div>
 <h2>Meal ideas helper</h2><div class="panel">
  <p>Meal ideas use your <b>Claude app</b> by default, at no extra cost.</p>
  <p class="meta">Optional: a free Google Gemini key lets Larder suggest meals, read nutrition-label photos and estimate foods right inside the app. Get one at aistudio.google.com → Get API key. On the free tier, Google may use what you send to improve its products. Your key is stored only on this phone.</p>
  <div class="grid2"><label class="f span2"><span>Gemini API key</span><input id="gem-key" type="password" autocomplete="off" value="${esc(S.set.gemKey)}" placeholder="Paste your key"></label><label class="f span2"><span>Model</span><input id="gem-model" autocomplete="off" value="${esc(S.set.gemModel)}"></label></div>
  <button class="btn pri wide" data-a="savekey">Save</button></div>
 <h2>Your data</h2><div class="panel"><p class="meta">Everything is saved on this phone only. Back up now and then, for example to iCloud Drive, so you don’t lose it if you delete the app or change phones.</p>
  <div class="row" style="margin-top:8px"><button class="btn" data-a="sharebk">Back up</button><button class="btn ghost" data-a="restore">Restore a backup</button><input type="file" accept="application/json,.json" class="vh" id="in-restore"></div></div>`;
}
function drawW(){
 const s=$('#wsvg');if(!s)return;const W=s.clientWidth,H=s.clientHeight;if(!W)return;
 const m=S.goals.unit==='lb'?LB:1,pts=S.weights.slice(-90);
 if(pts.length<2){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".55" font-size="14">Log two weigh-ins to see your trend</text>`;return}
 const t0=parseD(pts[0].d).getTime(),t1=parseD(pts[pts.length-1].d).getTime()||t0+1,v=pts.map(p=>p.kg*m),lo=Math.min(...v),hi=Math.max(...v),pad=Math.max(.5,(hi-lo)*.15);
 const L=W<520?8:40,R=W-12,T=12,B=H-24,x=p=>L+(parseD(p.d).getTime()-t0)/Math.max(1,t1-t0)*(R-L),y=val=>B-(val-(lo-pad))/((hi+pad)-(lo-pad))*(B-T);
 const d=pts.map((p,i)=>`${i?'L':'M'}${x(p).toFixed(1)},${y(v[i]).toFixed(1)}`).join('');
 const ticks=W<520?'':[lo,(lo+hi)/2,hi].map(tv=>`<text x="${L-8}" y="${y(tv)+4}" text-anchor="end" font-size="12" fill="currentColor" opacity=".6">${g1(tv)}</text><line x1="${L}" x2="${R}" y1="${y(tv)}" y2="${y(tv)}" stroke="currentColor" opacity=".12"/>`).join('');
 const lp=pts[pts.length-1],lx=x(lp),ly=y(v[v.length-1]);
 s.innerHTML=`${ticks}<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${x(p).toFixed(1)}" cy="${y(v[i]).toFixed(1)}" r="3" fill="var(--bg)" stroke="var(--ink)" stroke-width="2"/>`).join('')}<circle cx="${lx}" cy="${ly}" r="6" fill="var(--acc)"/><text x="${L}" y="${H-4}" font-size="12" fill="currentColor" opacity=".6">${esc(parseD(pts[0].d).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</text><text x="${R}" y="${H-4}" font-size="12" text-anchor="end" fill="currentColor" opacity=".6">${esc(parseD(lp.d).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</text>`;
}

function render(){
 $$('.tabs a').forEach(a=>a.dataset.t===S.tab?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 $('#sync').textContent='Saved on this phone';
 if(ro){ro.disconnect();ro=null}
 const y=window.scrollY;
 $('#view').innerHTML=({today:vToday,kitchen:vKitchen,meals:vMeals,progress:vProgress})[S.tab]();
 window.scrollTo(0,y);
 if(S.tab==='progress'){const f=$('#wfig');if(f){ro=new ResizeObserver(drawW);ro.observe(f)}}
}
function route(){const h=location.hash.slice(1);const nt=['today','kitchen','meals','progress'].includes(h)?h:'today';if(nt!==S.tab)window.scrollTo(0,0);S.tab=nt;render()}
window.addEventListener('hashchange',route);
// a new day while the app sits open in the background
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=TODAY();if(S.lastDay&&S.lastDay!==t&&S.day===S.lastDay)S.day=t;S.lastDay=t;render()}else stopScan()});

const inv=load('inv',{items:[]}),foods=load('foods',{map:{}}),goals=load('goals',null),w=load('weights',{list:[]}),set=load('settings',null),ideas=load('ideas',null);
S.inv=Array.isArray(inv.items)?inv.items:[];S.foods=foods.map&&typeof foods.map==='object'?foods.map:{};
if(goals&&typeof goals==='object')S.goals={...S.goals,...goals};if(set&&typeof set==='object')S.set={...S.set,...set};
S.weights=Array.isArray(w.list)?w.list:[];if(Array.isArray(ideas))S.ideas=ideas;S.lastDay=TODAY();
route();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
